# Cổng chất lượng cho mọi thay đổi vào main.
#
# Chạy đúng những lệnh đang chạy ở máy, không thêm bớt, để kết quả trên CI và
# kết quả của người sửa mã không bao giờ lệch nhau.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Đẩy commit mới lên cùng một nhánh thì huỷ lượt chạy cũ, đỡ xếp hàng.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Action của bên thứ ba được ghim theo mã commit, không theo thẻ `v4`: thẻ có
# thể bị chuyển sang commit khác, còn mã commit thì không. Khi nâng phiên bản,
# lấy mã mới bằng `gh api repos/actions/checkout/git/ref/tags/<thẻ>`.

jobs:
  kiem-tra:
    name: Typecheck, build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Phải khớp Node ở máy phát triển, không phải mức tối thiểu trong
          # "engines". Node 22 kèm npm 10, Node 24 kèm npm 11, và hai bản npm
          # này xử lý peer dependency khác nhau: lock do npm 11 sinh ra có một
          # peer @cloudflare/workers-types@^5 không được cài (từ wrangler lồng
          # trong @cloudflare/vite-plugin); npm 11 bỏ qua, npm 10 coi là thiếu
          # trong lock và npm ci thất bại.
          node-version: "24"
          cache: npm

      - name: Cài thư viện
        # npm ci đọc package-lock.json và cài đúng phiên bản đã khoá, khác với
        # npm install ở chỗ nó không tự sửa lock — CI phải chạy trên đúng cây
        # phụ thuộc mà người sửa mã đã kiểm thử.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck, build và toàn bộ bài kiểm thử
        # npm test đã gồm typecheck và build; chạy riêng từng bước sẽ build hai
        # lần cho cùng một kết quả.
        run: npm test

  bao-mat:
    name: Rà soát phụ thuộc
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Cây production phải sạch
        # Đây là cây thật sự chạy trên Cloudflare. Có cảnh báo ở đây là chặn.
        run: npm audit --omit=dev --audit-level=low

      - name: Cây dev/build - chặn mức nghiêm trọng
        # Một số gói nằm ở devDependencies nhưng vẫn được đóng vào bản chạy
        # thật (react-server-dom-webpack là runtime của React Server
        # Components), nên bước --omit=dev ở trên không nhìn thấy chúng. Lỗi
        # mức critical ở bất kỳ đâu trong cây đều chặn.
        run: npm audit --audit-level=critical

      - name: Cây dev/build - phần còn lại chỉ báo, không chặn
        # Toolchain phát triển còn cảnh báo chưa gỡ được. Ghi ra để thấy khi
        # nào con số đổi.
        run: npm audit || true

  cau-hinh:
    name: Cấu hình an toàn
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ALLOW_DEV_SETUP không được khai báo trong mã
        # Biến này mở route xoá sạch cơ sở dữ liệu. Route đã mặc định đóng,
        # nhưng khai báo biến trong wrangler.jsonc hay vite.config.ts sẽ mở
        # lại nó trên bản deploy thật.
        run: |
          if grep -rn 'ALLOW_DEV_SETUP' --include='*.jsonc' --include='*.json' \
               --include='vite.config.ts' --include='*.yml' . \
               | grep -v node_modules | grep -v '.github/workflows/ci.yml'; then
            echo "::error::ALLOW_DEV_SETUP xuất hiện trong file cấu hình. Gỡ ra trước khi merge."
            exit 1
          fi
          echo "Không thấy ALLOW_DEV_SETUP trong cấu hình."

      - name: Gói bàn giao không được chứa dữ liệu
        # git archive chỉ lấy file git theo dõi, nên chỉ cần bảo đảm không có
        # file dữ liệu nào lọt vào danh sách theo dõi.
        run: |
          if git ls-files | grep -E '^\.wrangler/|^\.env$|^\.env\.|^node_modules/' \
               | grep -v '^\.env\.example$'; then
            echo "::error::Có file dữ liệu hoặc cấu hình riêng đang được git theo dõi."
            exit 1
          fi
          echo "Không có file dữ liệu nào bị git theo dõi."
