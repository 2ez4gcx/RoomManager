name: Đề xuất tính năng
description: Một việc bạn muốn phần mềm làm được
labels: ["enhancement"]
body:
  - type: textarea
    id: van-de
    attributes:
      label: Bạn đang gặp khó khăn gì?
      description: Mô tả công việc thực tế ở nhà trọ mà hiện phần mềm chưa giúp được.
    validations:
      required: true
  - type: textarea
    id: de-xuat
    attributes:
      label: Bạn muốn nó hoạt động thế nào?
    validations:
      required: true
  - type: textarea
    id: cach-khac
    attributes:
      label: Hiện bạn đang xử lý bằng cách nào?
      description: Sổ tay, Excel, phần mềm khác...
